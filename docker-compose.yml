networks:
  crypto-network:
    driver: bridge

services:
  # --- REVERSE PROXY (TRAEFIK) ---
  traefik:
    image: traefik:v3.0
    container_name: traefik
    command:
      - "--api.insecure=true" # Traefik-Dashboard freischalten (access über 8080)
      - "--providers.docker=true" # Docker-Engine beobachten und Labels von neuen Containern auslesen
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - crypto-network

  # --- INFRASTRUKTUR ---
  redis:
    image: redis:alpine
    container_name: crypto_redis
    networks:
      - crypto-network

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: crypto_rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - crypto-network
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.localhost`)"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"

  # --- APP SERVICES ---
  ingestion-service:
    build: ./services/ingestion
    container_name: crypto_ingestion
    restart: always
    command: hupper -m ingestion_main
    volumes:
      - ./services/ingestion:/app
    depends_on:
      - rabbitmq
    env_file:
      - ./services/ingestion/.env
    networks:
      - crypto-network

  backend-consumer:
    build: ./services/backend
    container_name: crypto_consumer
    restart: always
    command: hupper -m consumer # Überschreibt den CMD-Befehl aus dem Backend-Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./services/backend:/app
    depends_on:
      - rabbitmq
      - redis
      - postgres
    env_file:
      - ./services/backend/.env
    networks:
      - crypto-network

  backend-api:
    build: ./services/backend
    container_name: crypto_api
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/backend:/app
    depends_on:
      - redis
    env_file:
      - ./services/backend/.env
    networks:
      - crypto-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.crypto.localhost`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  frontend:
    image: node:20-alpine
    container_name: crypto_frontend
    restart: always
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - WATCHPACK_POLLING=true # Zwingt den React-Watcher unter Windows/Docker zum Erkennen
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
    depends_on:
      - backend-api
    networks:
      - crypto-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`crypto.localhost`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"

  postgres:
    image: postgres:16-alpine
    container_name: crypto_postgres
    restart: always
    environment:
      POSTGRES_USER: crypto_user
      POSTGRES_PASSWORD: crypto_password
      POSTGRES_DB: crypto_db
    ports:
      - "5432:5432" # Öffnet den Port für DBeaver auf deinem Host
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crypto-network

volumes:
  rabbitmq_data:
  postgres_data: